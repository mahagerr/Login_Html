<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students CRUD Demo</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f7f7f7;
    color: #222;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  .card {
    background: #fff;
    border: 1px solid #d9d9d9;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }

  h1, h2, h3 {
    margin-top: 0;
  }

  .ok { color: #0a7a33; }
  .warn { color: #9a6700; }
  .error { color: #b00020; }

  #status, #form-status {
    font-weight: bold;
    margin-bottom: 12px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  input {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
  }

  .button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
  }

  button {
    padding: 12px 16px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #1d4ed8;
  }

  .delete-btn {
    background: #dc2626;
  }

  .delete-btn:hover {
    background: #b91c1c;
  }

  .secondary-btn {
    background: #475569;
  }

  .secondary-btn:hover {
    background: #334155;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 10px 12px;
    text-align: left;
  }

  th {
    background: #f2f2f2;
  }

  pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: #f6f6f6;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    margin: 0;
  }

  .small {
    color: #666;
  }
</style>
</head>
<body>

<div class="container">

<h1>Students</h1>

<div class="card">
  <h2>Student Form</h2>
  <p class="small">
    Use:
    <br>• <strong>Add Student</strong> for a new row
    <br>• <strong>Update Student</strong> to change an existing row by ID
    <br>• <strong>Delete Student</strong> to remove a row by ID
  </p>

  <div id="form-status" class="warn">Ready.</div>

  <div class="grid">

    <div class="field">
      <label for="student-id">Student ID</label>
      <input id="student-id" type="number" placeholder="Needed for update/delete">
    </div>

    <div class="field">
      <label for="student-firstname">First Name</label>
      <input id="student-firstname" type="text" placeholder="Enter first name">
    </div>

    <div class="field">
      <label for="student-lastname">Last Name</label>
      <input id="student-lastname" type="text" placeholder="Enter last name">
    </div>

    <div class="field">
      <label for="student-classname">Class Name</label>
      <input id="student-classname" type="text" placeholder="Enter class name">
    </div>

    <div class="field">
      <label for="student-score">Score</label>
      <input id="student-score" type="number" placeholder="Enter score">
    </div>

  </div>

  <div class="button-row">
    <button id="add-btn">Add Student</button>
    <button id="update-btn" class="secondary-btn">Update Student</button>
    <button id="delete-btn" class="delete-btn">Delete Student</button>
    <button id="clear-btn" class="secondary-btn">Clear Boxes</button>
  </div>
</div>

<div class="card">
  <h2>Status</h2>
  <div id="status" class="warn">Loading students...</div>
</div>

<div class="card">
  <h2>Students Table</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Class</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr>
        <td colspan="5">No data loaded yet.</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="card">
  <h2>Debug Output</h2>
  <pre id="debug">Nothing yet.</pre>
</div>

</div>

<script>
const supabaseUrl = 'https://neamnczhparfzzonpocu.supabase.co';
const supabaseKey = 'sb_publishable_TNTrL9tGgE-U150UyzRgww_KuTBCFR0';

const statusEl = document.getElementById('status');
const formStatusEl = document.getElementById('form-status');
const tableBody = document.getElementById('table-body');
const debugEl = document.getElementById('debug');

const studentIdInput = document.getElementById('student-id');
const firstnameInput = document.getElementById('student-firstname');
const lastnameInput = document.getElementById('student-lastname');
const classnameInput = document.getElementById('student-classname');
const scoreInput = document.getElementById('student-score');

const addBtn = document.getElementById('add-btn');
const updateBtn = document.getElementById('update-btn');
const deleteBtn = document.getElementById('delete-btn');
const clearBtn = document.getElementById('clear-btn');

function setStatus(msg, cls = 'warn') {
  statusEl.textContent = msg;
  statusEl.className = cls;
}

function setFormStatus(msg, cls = 'warn') {
  formStatusEl.textContent = msg;
  formStatusEl.className = cls;
}

function setDebug(obj) {
  debugEl.textContent = typeof obj === 'string'
    ? obj
    : JSON.stringify(obj, null, 2);
}

function getIdValue() {
  return Number(studentIdInput.value);
}

function getFirstnameValue() {
  return firstnameInput.value.trim();
}

function getLastnameValue() {
  return lastnameInput.value.trim();
}

function getClassnameValue() {
  return classnameInput.value.trim();
}

function getScoreValue() {
  return Number(scoreInput.value);
}

function clearInputs() {
  studentIdInput.value = '';
  firstnameInput.value = '';
  lastnameInput.value = '';
  classnameInput.value = '';
  scoreInput.value = '';
  setFormStatus('Boxes cleared.', 'warn');
}

async function loadStudents() {
  try {
    const response = await fetch(
      `${supabaseUrl}/rest/v1/students?select=id,firstname,lastname,classname,score&order=id.asc`,
      {
        method: 'GET',
        headers: {
          apikey: supabaseKey,
          Authorization: `Bearer ${supabaseKey}`,
          Accept: 'application/json'
        }
      }
    );

    const text = await response.text();
    let data;

    try { data = JSON.parse(text); }
    catch { data = null; }

    if (!response.ok) {
      setStatus(`GET failed: ${response.status}`, 'error');
      setDebug(text);
      return;
    }

    if (!Array.isArray(data) || data.length === 0) {
      setStatus('Connected, but no rows found.', 'warn');
      tableBody.innerHTML = '<tr><td colspan="5">No records found.</td></tr>';
      return;
    }

    setStatus(`Loaded ${data.length} row(s).`, 'ok');
    tableBody.innerHTML = '';

    data.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.id}</td>
        <td>${row.firstname}</td>
        <td>${row.lastname}</td>
        <td>${row.classname}</td>
        <td>${row.score}</td>
      `;
      tableBody.appendChild(tr);
    });

    setDebug(data);
  } catch (err) {
    setStatus('Fetch error: ' + err.message, 'error');
    setDebug({ error: err.message });
  }
}

async function addStudent() {
  const firstname = getFirstnameValue();
  const lastname = getLastnameValue();
  const classname = getClassnameValue();
  const score = getScoreValue();

  if (!firstname) {
    setFormStatus('Please enter a first name.', 'error');
    return;
  }

  if (Number.isNaN(score)) {
    setFormStatus('Please enter a valid score.', 'error');
    return;
  }

  setFormStatus('Adding student...', 'warn');

  try {
    const response = await fetch(`${supabaseUrl}/rest/v1/students`, {
      method: 'POST',
      headers: {
        apikey: supabaseKey,
        Authorization: `Bearer ${supabaseKey}`,
        'Content-Type': 'application/json',
        Prefer: 'return=representation'
      },
      body: JSON.stringify([{
        firstname,
        lastname,
        classname,
        score
      }])
    });

    const text = await response.text();
    let data;

    try { data = JSON.parse(text); }
    catch { data = text; }

    if (!response.ok) {
      setFormStatus(`Insert failed: ${response.status}`, 'error');
      setDebug(data);
      return;
    }

    setFormStatus(`Added ${firstname} successfully.`, 'ok');
    clearInputs();
    await loadStudents();
  } catch (err) {
    setFormStatus('Insert error: ' + err.message, 'error');
    setDebug({ error: err.message });
  }
}

async function updateStudent() {
  const id = getIdValue();
  const firstname = getFirstnameValue();
  const lastname = getLastnameValue();
  const classname = getClassnameValue();
  const score = getScoreValue();

  if (Number.isNaN(id)) {
    setFormStatus('Please enter a student ID.', 'error');
    return;
  }

  setFormStatus(`Updating student ID ${id}...`, 'warn');

  try {
    const response = await fetch(`${supabaseUrl}/rest/v1/students?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        apikey: supabaseKey,
        Authorization: `Bearer ${supabaseKey}`,
        'Content-Type': 'application/json',
        Prefer: 'return=representation'
      },
      body: JSON.stringify({
        firstname,
        lastname,
        classname,
        score
      })
    });

    const text = await response.text();
    let data;

    try { data = JSON.parse(text); }
    catch { data = text; }

    if (!response.ok) {
      setFormStatus(`Update failed: ${response.status}`, 'error');
      setDebug(data);
      return;
    }

    setFormStatus(`Updated student ID ${id}.`, 'ok');
    clearInputs();
    await loadStudents();
  } catch (err) {
    setFormStatus('Update error: ' + err.message, 'error');
    setDebug({ error: err.message });
  }
}

async function deleteStudent() {
  const id = getIdValue();

  if (Number.isNaN(id)) {
    setFormStatus('Please enter a student ID.', 'error');
    return;
  }

  setFormStatus(`Deleting student ID ${id}...`, 'warn');

  try {
    const response = await fetch(`${supabaseUrl}/rest/v1/students?id=eq.${id}`, {
      method: 'DELETE',
      headers: {
        apikey: supabaseKey,
        Authorization: `Bearer ${supabaseKey}`,
        Prefer: 'return=representation'
      }
    });

    const text = await response.text();
    let data;

    try { data = JSON.parse(text); }
    catch { data = text; }

    if (!response.ok) {
      setFormStatus(`Delete failed: ${response.status}`, 'error');
      setDebug(data);
      return;
    }

    setFormStatus(`Deleted student ID ${id}.`, 'ok');
    clearInputs();
    await loadStudents();
  } catch (err) {
    setFormStatus('Delete error: ' + err.message, 'error');
    setDebug({ error: err.message });
  }
}

addBtn.addEventListener('click', addStudent);
updateBtn.addEventListener('click', updateStudent);
deleteBtn.addEventListener('click', deleteStudent);
clearBtn.addEventListener('click', clearInputs);

loadStudents();
</script>

</body>
</html>
