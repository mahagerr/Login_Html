<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Table</title>

<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: left;
  }

  th {
    background: #f2f2f2;
  }
</style>
</head>

<body>

<h1>Student Scores</h1>

<table>
  <thead>
    <tr>
      <th>firstname</th>
      <th>lastname</th>
      <th>class</th>
      <th>score</th>
    </tr>
  </thead>
  <tbody id="data-body">
    <!-- Rows will be inserted here -->
  </tbody>
</table>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const supabaseUrl = 'https://jwlbcmapgdiljmgnqoxe.supabase.co'
  const supabaseAnonKey = 'sb_publishable_HsEO0dQTkP3HJAy80pfMqQ_EZRay4GJ'
  const supabase = createClient(supabaseUrl, supabaseAnonKey)

  async function loadTable() {
    const { data, error } = await supabase
      .from('students')  
      .select('*')

    if (error) {
      console.error('Error loading data:', error)
      return
    }

    const tbody = document.getElementById('data-body')
    tbody.innerHTML = ""

    data.forEach(row => {
      const tr = document.createElement('tr')
      tr.innerHTML = `
        <td>${row.firstname}</td>
        <td>${row.lastname}</td>
        <td>${row.class}</td>
        <td>${row.score}</td>
      `
      tbody.appendChild(tr)
    })
  }

  loadTable()
</script>

</body>
</html>
