<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Supabase Students Diagnostic</title>
<style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f7f7f7;
      color: #222;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    .card {
      background: #fff;
      border: 1px solid #d9d9d9;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    #status { font-weight: bold; margin-bottom: 12px; }
    .ok { color: #0a7a33; }
    .warn { color: #9a6700; }
    .error { color: #b00020; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 10px 12px; text-align: left; }
    th { background: #f2f2f2; }
    pre {
      white-space: pre-wrap;
      background: #f6f6f6;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin: 0;
    }
    .log-line {
      padding: 4px 0;
      border-bottom: 1px solid #eee;
      font-family: monospace;
    }
</style>
</head>
<body>
<div class="container">

<h1>Students</h1>
<p class="small">
This page checks whether your GitHub-hosted site can access the
<code>students</code> table in Supabase.
</p>

<div class="card">
  <div id="status" class="warn">Page loaded. Waiting to start test...</div>
  <div id="log"></div>
</div>

<div class="card">
<h2>Returned Data</h2>
<table>
<thead>
<tr>
  <th>ID</th>
  <th>Firstname</th>
  <th>Lastname</th>
  <th>Classname</th>
  <th>Score</th>
</tr>
</thead>
<tbody id="table-body">
<tr><td colspan="5">No data loaded yet.</td></tr>
</tbody>
</table>
</div>

<div class="card">
<h2>Debug Output</h2>
<pre id="debug">Nothing yet.</pre>
</div>

</div>

<script>
const supabaseUrl = 'https://neamnczhparfzzonpocu.supabase.co';
const supabaseKey = 'sb_publishable_TNTrL9tGgE-U150UyzRgww_KuTBCFR0';

const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const tableBody = document.getElementById('table-body');
const debugEl = document.getElementById('debug');

function setStatus(msg, cls='warn') {
  statusEl.textContent = msg;
  statusEl.className = cls;
}

function addLog(msg) {
  const div = document.createElement('div');
  div.className = 'log-line';
  div.textContent = msg;
  logEl.appendChild(div);
}

function setDebug(obj) {
  debugEl.textContent = typeof obj === 'string'
    ? obj
    : JSON.stringify(obj, null, 2);
}

async function runTest() {
  setStatus('Script started. Preparing request...', 'warn');
  addLog('Script started');
  addLog('Supabase URL: ' + supabaseUrl);
  addLog('Table: students');

  // ✅ FIXED: Correct column names
  const requestUrl = `${supabaseUrl}/rest/v1/students?select=id,firstname,lastname,classname,score&order=id.asc`;
  addLog('Request URL built');

  try {
    setStatus('Sending request to Supabase...', 'warn');
    addLog('Fetch started');

    const response = await fetch(requestUrl, {
      method: 'GET',
      headers: {
        apikey: supabaseKey,
        Authorization: `Bearer ${supabaseKey}`,
        Accept: 'application/json'
      }
    });

    addLog('Response received: ' + response.status);

    const text = await response.text();
    let json;

    try {
      json = JSON.parse(text);
    } catch {
      json = null;
    }

    if (!response.ok) {
      setStatus('HTTP error: ' + response.status, 'error');
      tableBody.innerHTML = `<tr><td colspan="5">Request failed.</td></tr>`;
      setDebug({ status: response.status, body: text });
      return;
    }

    if (!Array.isArray(json)) {
      setStatus('Unexpected response format', 'error');
      tableBody.innerHTML = `<tr><td colspan="5">Unexpected format.</td></tr>`;
      setDebug(text);
      return;
    }

    if (json.length === 0) {
      setStatus('Connected, but no rows returned.', 'warn');
      tableBody.innerHTML = `<tr><td colspan="5">No records found.</td></tr>`;
      setDebug(json);
      return;
    }

    setStatus(`Success: Loaded ${json.length} rows.`, 'ok');

    tableBody.innerHTML = '';
    json.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.id}</td>
        <td>${row.firstname}</td>
        <td>${row.lastname}</td>
        <td>${row.classname}</td>
        <td>${row.score}</td>
      `;
      tableBody.appendChild(tr);
    });

    setDebug(json);

  } catch (err) {
    setStatus('Fetch error: ' + err.message, 'error');
    tableBody.innerHTML = `<tr><td colspan="5">Error occurred.</td></tr>`;
    setDebug(err);
  }
}

runTest();
</script>

</body>
</html>
